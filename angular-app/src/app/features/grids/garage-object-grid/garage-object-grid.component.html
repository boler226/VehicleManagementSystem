<app-table
  [title]="'Гаражні обʼєкти'"
  [columns]="columns"
  [data]="garageObjects$ | async"
  [canCrud]="canCrud"
  (edit)="updateGarage($event)"
  (delete)="deleteGarage($event)" />

@if (showUpdateForm && canCrud) {
  <div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Редагування гаражного обʼєкта</h5>
          <button type="button" class="btn-close" (click)="closeForm()"></button>
        </div>
        <div class="modal-body">
          <app-dynamic-form
            [fields]="updateFields"
            [initialData]="selectedGarage"
            (save)="onUpdateSave($event)" />
        </div>
      </div>
    </div>
  </div>
}

@if (canCrud) {
  <button class="btn btn-primary mt-2" (click)="openAddForm()">Додати гаражний обʼєкт</button>
}

@if (showAddForm && canCrud) {
  <div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Додавання гаражного обʼєкта</h5>
          <button type="button" class="btn-close" (click)="closeAddForm()"></button>
        </div>
        <div class="modal-body">
          <app-dynamic-form
            [fields]="addFields"
            (save)="onAddSave($event)" />
        </div>
      </div>
    </div>
  </div>
}
